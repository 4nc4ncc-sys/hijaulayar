      <form onsubmit="sendToWhatsApp(); return false;">
  <input type="text" id="name" placeholder="Nama/Perusahaan" required>
  <input type="tel" id="phone" placeholder="Nomor Telepon" required>
  <button type="submit">Submit</button>
</form>

<script>
function sendToWhatsApp() {
  var name = document.getElementById("name").value;
  var phone = document.getElementById("phone").value;
  var url = "https://wa.me/6281318624079?text=" 
            + "Nama/Perusahaan: " + name + "%0a"
            + "Nomor Telepon: " + phone;
  window.open(url, "_blank");
}
</script>
